name: Deploy CaseTrack

on:
  push:
    branches:
      - main
      - '**'

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref_name != 'gh-pages'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Build Project
        shell: bash
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$BRANCH_NAME" == "main" ]]; then
            npm run build -- --base=/CaseTrack/
          else
            PREVIEW_NAME="${BRANCH_NAME//\//--}"
            PREVIEW_NAME="${PREVIEW_NAME//[^a-zA-Z0-9._-]/-}"
            npm run build -- --base="/CaseTrack/previews/${PREVIEW_NAME}/"
            mv dist "$RUNNER_TEMP/casetrack-preview"
            mkdir -p "dist/previews/${PREVIEW_NAME}"
            cp -a "$RUNNER_TEMP/casetrack-preview/." "dist/previews/${PREVIEW_NAME}/"
          fi

      - name: Publish to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./dist
          keep_files: true
          enable_jekyll: false
