<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <title>CaseTrack | Change Temporary Password</title>
    <link rel="stylesheet" href="../assets/css/login.css">
</head>
<body>
    <main class="login-wrapper">
        <section class="login-container">
            <h1>Change your temporary password</h1>
            <p id="passwordChangeMessage" role="status" aria-live="polite">Verifying your account…</p>
            <form id="passwordChangeForm" class="login-form" hidden>
                <label for="newPassword">New password</label>
                <input id="newPassword" type="password" autocomplete="new-password" minlength="12" maxlength="128" required>
                <label for="confirmPassword">Confirm new password</label>
                <input id="confirmPassword" type="password" autocomplete="new-password" minlength="12" maxlength="128" required>
                <button class="button primary" id="passwordChangeButton" type="submit">Change password</button>
            </form>
        </section>
    </main>
    <script type="module" src="../assets/js/initial-password-change.js"></script>
</body>
</html>
