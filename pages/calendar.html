<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="CaseTrack calendar view">
    <title>CaseTrack | Calendar</title>
    <link rel="stylesheet" href="../assets/css/dashboard.css">
    <link rel="stylesheet" href="../assets/css/shared.css">
    <link rel="stylesheet" href="../assets/css/calendar.css">
</head>

<body data-page="calendar">
    <div class="layout">
        

        <main class="main">
            

            <section class="content calendar-shell">
                <div class="calendar-page-header">
                    <div>
                        <p class="eyebrow">Calendar</p>
                        <h1>Case Calendar</h1>
                    </div>
                    <div class="calendar-options">
                        <label class="field-select-label">
                            <span>Show by</span>
                            <select id="dateFieldSelect">
                                <option value="registrationDate">Registration Date</option>
                                <option value="chargesheetDate">Chargesheet Date</option>
                                <option value="firDate">Date of FIR</option>
                                <option value="nextDate">Next Date</option>
                            </select>
                        </label>
                        <div class="month-nav">
                            <button type="button" id="prevMonthBtn" aria-label="Previous month">←</button>
                            <button type="button" id="nextMonthBtn" aria-label="Next month">→</button>
                        </div>
                    </div>
                </div>

                <div class="calendar-layout">
                    <section class="panel calendar-panel">
                        <div class="panel-heading">
                            <div class="panel-title">
                                <div class="mini-icon">▣</div>
                                <h2 id="monthLabel">Month Year</h2>
                            </div>
                        </div>

                        <div class="weekday-row">
                            <span>Sun</span>
                            <span>Mon</span>
                            <span>Tue</span>
                            <span>Wed</span>
                            <span>Thu</span>
                            <span>Fri</span>
                            <span>Sat</span>
                        </div>

                        <div id="calendarGrid" class="calendar-grid" aria-live="polite"></div>
                    </section>

                    <aside class="panel day-panel">
                        <div class="panel-heading">
                            <div class="panel-title">
                                <div class="mini-icon">✓</div>
                                <h2>Selected Date</h2>
                            </div>
                        </div>

                        <div class="selected-date-meta">
                            <strong id="selectedDateLabel">Select a date</strong>
                        </div>
                        <div id="selectedDateCases" class="selected-date-cases"></div>
                    </aside>
                </div>
            </section>
        </main>
    </div>

    <script src="../assets/js/calendar.js"></script>
    <script type="module" src="../assets/js/calendar.js"></script>
    <script type="module" src="../assets/js/shared-layout.js"></script>
</body>

</html>
