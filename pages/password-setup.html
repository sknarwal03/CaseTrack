<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <title>CaseTrack | Set Password</title>
    <link rel="stylesheet" href="../assets/css/login.css">
</head>
<body>
    <main class="login-wrapper">
        <section class="login-container">
            <h1>Set your CaseTrack password</h1>
            <p id="setupMessage" role="status" aria-live="polite">Checking your secure link…</p>
            <form id="setupForm" class="login-form" hidden>
                <p id="setupEmail"></p>
                <label for="newPassword">New password</label>
                <input id="newPassword" type="password" autocomplete="new-password" minlength="12" maxlength="128" required>
                <label for="confirmPassword">Confirm password</label>
                <input id="confirmPassword" type="password" autocomplete="new-password" minlength="12" maxlength="128" required>
                <button class="button primary" type="submit">Set password</button>
            </form>
            <a id="loginLink" href="login.html" hidden>Continue to sign in</a>
        </section>
    </main>
    <script type="module" src="../assets/js/password-setup.js"></script>
</body>
</html>
