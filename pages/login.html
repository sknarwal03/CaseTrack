<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CaseTrack | Login</title>
    <link rel="stylesheet" href="../assets/css/landing.css">
    <link rel="stylesheet" href="../assets/css/login.css">
</head>

<body>
    <div class="login-wrapper">
        <div class="login-container">
            <div class="brand">
                <div class="brand-mark">⚖</div>
                <div><strong>CaseTrack </strong><small>Case Management System</small></div>
            </div>

            <form id="loginForm" class="login-form">
                <h2>Welcome Back</h2>
                <p>Sign in to access your Cases and Dashboard.</p>

                <div class="input-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="officer@casetrack.gov" required>
                </div>

                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="••••••••" required>
                </div>

                <div class="actions">
                    <label class="remember">
                        <input type="checkbox" name="remember" checked> Remember me
                    </label>
                    <a href="#" class="forgot-link">Forgot password?</a>
                </div>

                <button type="submit" class="button primary login-btn">Sign In</button>

                <div class="error-msg" id="loginError"></div>
            </form>
        </div>
    </div>

    <script type="module" src="../assets/js/login.js"></script>
</body>

</html>
