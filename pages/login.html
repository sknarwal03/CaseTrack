<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CaseTrack | Login</title>
  <script type="module" crossorigin src="/CaseTrack/assets/login-TsNsc9B3.js"></script>
  <link rel="modulepreload" crossorigin href="/CaseTrack/assets/index.esm-CMMpLTlb.js">
  <link rel="modulepreload" crossorigin href="/CaseTrack/assets/firebase-functions-D3hq5K6S.js">
  <link rel="stylesheet" crossorigin href="/CaseTrack/assets/landing-BIeV1-vT.css">
  <link rel="stylesheet" crossorigin href="/CaseTrack/assets/login-JlTnPJCr.css">
</head>

<body>
    <div class="login-wrapper">
        <div class="login-container">
            <div class="brand">
                <div class="brand-mark">⚖</div>
                <div><strong>CaseTrack </strong><small>Case Management System</small></div>
            </div>

            <form id="loginForm" class="login-form">
                <h2>Welcome Back</h2>
                <p>Sign in to access your Cases and Dashboard.</p>

                <div class="input-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="officer@casetrack.gov" required>
                </div>

                <div class="input-group">
                    <label for="password">Password</label>
                    <div class="password-input-wrap">
                        <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" required>
                        <button type="button" class="password-toggle" id="togglePassword" aria-label="Show password" aria-pressed="false">Show</button>
                    </div>
                </div>

                <div class="actions">
                    <label class="remember">
                        <input type="checkbox" name="remember" checked> Remember me
                    </label>
                    <a href="#" class="forgot-link">Forgot password? Contact Admin</a>
                </div>

                <button type="submit" class="button primary login-btn">Sign In</button>

                <div class="error-msg" id="loginError" role="status" aria-live="polite"></div>
            </form>
        </div>
    </div>

</body>

</html>
