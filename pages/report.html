<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="CaseTrack report page">
    <title>CaseTrack | Report</title>
  <script type="module" crossorigin src="/CaseTrack/assets/report-CafmNSN6.js"></script>
  <link rel="modulepreload" crossorigin href="/CaseTrack/assets/index.esm-CMMpLTlb.js">
  <link rel="modulepreload" crossorigin href="/CaseTrack/assets/firebase-functions-D3hq5K6S.js">
  <link rel="modulepreload" crossorigin href="/CaseTrack/assets/shared-layout-QhUR6W1D.js">
  <link rel="stylesheet" crossorigin href="/CaseTrack/assets/shared-layout-BK3cueCb.css">
  <link rel="stylesheet" crossorigin href="/CaseTrack/assets/report-ZDghMMRC.css">
</head>

<body data-page="report">
    <div class="layout">
        

        <main class="main">
            

            <section class="content report-shell">
                <div class="welcome report-header">
                    <div>
                        <p class="eyebrow">Reports</p>
                        <h1>Case Insights</h1>
                    </div>
                    <button class="new-case" type="button">Export Report</button>
                </div>

                <section class="stats report-stats">
                    <article class="stat">
                        <div class="stat-icon blue">▰</div>
                        <div>
                            <p>Unique FIRs</p>
                            <strong id="reportTotalCases">0</strong>
                        </div>
                        <em>All records</em>
                    </article>
                    <article class="stat">
                        <div class="stat-icon green">◉</div>
                        <div>
                            <p>Disposed</p>
                            <strong id="reportDisposed">0</strong>
                        </div>
                        <em>Completed</em>
                    </article>
                    <article class="stat">
                        <div class="stat-icon red">▣</div>
                        <div>
                            <p>Pending</p>
                            <strong id="reportPending">0</strong>
                        </div>
                        <em>At risk</em>
                    </article>
                    <article class="stat">
                        <div class="stat-icon mint">✓</div>
                        <div>
                            <p>Next Hearings</p>
                            <strong id="reportHearings">0</strong>
                        </div>
                        <em>Upcoming</em>
                    </article>
                </section>

                <div class="report-grid">
                    <section class="panel report-panel">
                        <div class="panel-heading">
                            <div class="panel-title">
                                <div class="mini-icon">⌁</div>
                                <h2>Case by Status</h2>
                            </div>
                        </div>
                        <div class="bar-chart" id="statusBarChart"></div>
                    </section>

                    <section class="panel report-panel">
                        <div class="panel-heading">
                            <div class="panel-title">
                                <div class="mini-icon">▣</div>
                                <h2>Case Stage</h2>
                            </div>
                        </div>
                        <div class="bar-chart" id="stageBarChart"></div>
                    </section>
                </div>

                <div class="report-grid lower-grid">
                    <section class="panel report-panel">
                        <div class="panel-heading">
                            <div class="panel-title">
                                <div class="mini-icon">▧</div>
                                <h2>Top Courts</h2>
                            </div>
                        </div>
                        <ul class="list-report" id="courtList"></ul>
                    </section>

                    <section class="panel report-panel">
                        <div class="panel-heading">
                            <div class="panel-title">
                                <div class="mini-icon">▰</div>
                                <h2>Police Station Summary</h2>
                            </div>
                        </div>
                        <ul class="list-report" id="policeList"></ul>
                    </section>
                </div>
            </section>
        </main>
    </div>

</body>

</html>
