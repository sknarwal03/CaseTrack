<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Proclaimed offender cases and related court proceedings">
    <title>CaseTrack | PO Cases</title>
    <link rel="stylesheet" href="../assets/css/dashboard.css">
    <link rel="stylesheet" href="../assets/css/shared.css">
    <link rel="stylesheet" href="../assets/css/po-cases.css">
</head>
<body data-page="po-cases">
    <div class="layout">
        <main class="main">
            <section class="content po-shell">
                <section class="panel po-panel" aria-labelledby="poCasesTitle">
                    <div class="panel-heading">
                        <div class="panel-title">
                            <div class="mini-icon" aria-hidden="true">§</div>
                            <div>
                                <h1 id="poCasesTitle">PO Cases</h1>
                                <p>Proclaimed offender accused linked to court proceedings</p>
                            </div>
                        </div>
                    </div>

                    <div class="po-toolbar">
                        <div class="po-filters" role="group" aria-label="Filter PO cases">
                            <button class="po-filter active" data-filter="all" type="button" aria-pressed="true">All PO Cases</button>
                            <button class="po-filter" data-filter="pending" type="button" aria-pressed="false">Pending</button>
                            <button class="po-filter" data-filter="review" type="button" aria-pressed="false">In Review</button>
                            <button class="po-filter" data-filter="active" type="button" aria-pressed="false">Active</button>
                            <button class="po-filter" data-filter="closed" type="button" aria-pressed="false">Disposed</button>
                        </div>
                        <div class="po-count" id="poCaseCount" aria-live="polite">Loading PO cases…</div>
                    </div>

                    <div class="po-table-wrap">
                        <table class="po-table">
                            <thead>
                                <tr>
                                    <th>FIR No.</th>
                                    <th>Date of FIR</th>
                                    <th>Under Section</th>
                                    <th>Accused</th>
                                    <th>Court of</th>
                                    <th>Next Hearing</th>
                                    <th>Case Status</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody id="poCasesTableBody">
                                <tr><td colspan="8" class="table-empty">Loading PO cases…</td></tr>
                            </tbody>
                        </table>
                    </div>
                </section>
            </section>
        </main>
    </div>
    <script type="module" src="../assets/js/po-cases.js"></script>
    <script type="module" src="../assets/js/shared-layout.js"></script>
</body>
</html>
